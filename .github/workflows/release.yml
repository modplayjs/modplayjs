name: Release

# Changesets automation: on every push to main the action consumes pending
# changesets — if any exist it opens/updates a "Version Packages" PR; when
# that PR is merged (i.e. a push contains no pending changesets but versions
# changed), it publishes the packages to npm, creates git tags and pushes
# them.
#
# Publish runs `changeset publish` (npm) with NPM_TOKEN + trusted-publishing
# provenance; `changeset git-tag` tags every released package version.

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npx turbo run build

      - name: Version and publish packages
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          push-git-tags: true
          create-github-releases: true
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true