name: Release

# Publishes every @modplayjs/* package to npmjs.com and to GitHub Packages.
#
# Flow: feature PR → changeset on main (auto-changeset.yml) → version-pr.yml
# keeps the rolling "chore: version packages" PR current → merging it lands the
# bumped versions on main → this workflow publishes them.
#
# npmjs.com authenticates with OIDC trusted publishing: no token is stored and
# npm attaches a provenance attestation on its own. The trusted publisher on
# npmjs.com must name this file (`release.yml`) and this repository, and each
# package's `repository.url` must point at modplayjs/modplayjs. GitHub Packages
# authenticates with the workflow's GITHUB_TOKEN.
#
# A manual run (workflow_dispatch) publishes whatever version is still missing
# from either registry, so a run that stopped halfway is finished by
# dispatching it again.

"on":
  push:
    branches:
      - main
    # The version PR is the only thing that rewrites a package version.
    # A path filter beats matching the commit message: a merge commit and a
    # squash commit word it differently, and any body quoting the phrase
    # would trigger a publish.
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # git tags created by `changeset git-tag`
  packages: write # npm.pkg.github.com
  id-token: write # npmjs.com trusted publishing

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers). Node 24 ships npm 11,
      # installing it explicitly keeps that independent of the image.
      - name: Install npm with OIDC support
        run: |
          npm install --global npm@11
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npx turbo run build --filter=./packages/*

      # Host-scoped, so the npmjs.com step below has no npmjs.com token and
      # falls through to OIDC. The variable stays a reference; its value is
      # supplied by the publish steps.
      - name: Configure GitHub Packages authentication
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"

      - name: Publish to npmjs.com
        run: |
          set -euo pipefail
          published=0
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ "$(node -p "Boolean(require('./$manifest').private)")" = "true" ]; then
              continue
            fi
            if npm view "$name@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "npmjs.com: $name@$version is already published"
              continue
            fi
            echo "npmjs.com: publishing $name@$version"
            (cd "$(dirname "$manifest")" && npm publish --access public --tag latest --registry https://registry.npmjs.org/)
            published=$((published + 1))
          done
          echo "npmjs.com: published $published package(s)"

      # Explicit registry instead of `changeset publish`: it follows each
      # package's publishConfig.registry and falls back to the default
      # registry when a package has none, which sent out-android to npmjs.com.
      # The loop treats both registries the same way.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          published=0
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ "$(node -p "Boolean(require('./$manifest').private)")" = "true" ]; then
              continue
            fi
            if npm view "$name@$version" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
              echo "GitHub Packages: $name@$version is already published"
              continue
            fi
            echo "GitHub Packages: publishing $name@$version"
            (cd "$(dirname "$manifest")" && npm publish --tag latest --registry https://npm.pkg.github.com/)
            published=$((published + 1))
          done
          echo "GitHub Packages: published $published package(s)"

      # Closing check: the run only counts as released when both registries
      # serve the version, not merely when npm exited 0. Newly published
      # versions can take a moment to replicate.
      - name: Verify both registries
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ "$(node -p "Boolean(require('./$manifest').private)")" = "true" ]; then
              continue
            fi
            for registry in https://registry.npmjs.org/ https://npm.pkg.github.com/; do
              found=false
              # npmjs.com processes a new version for up to a few minutes before
              # `npm view` can see it; 18 x 10 s covers replication without
              # hanging forever on a genuinely missing package.
              for attempt in $(seq 1 18); do
                if npm view "$name@$version" version --registry "$registry" >/dev/null 2>&1; then
                  found=true
                  break
                fi
                sleep 10
              done
              if [ "$found" = "false" ]; then
                echo "::error::$name@$version is missing from $registry"
                missing=1
              fi
            done
          done
          exit "$missing"

      # `changeset git-tag` runs `git tag <name> -m <name>`, an annotated tag.
      # Without a tagger identity that command fails, and changesets reports
      # the tag as created anyway, so the push below would be a silent
      # "Everything up-to-date".
      - name: Push release tags
        run: |
          git config user.name "Bitti09"
          git config user.email "Bitti09@users.noreply.github.com"
          npx changeset git-tag
          git push --tags

