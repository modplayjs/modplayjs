name: Release

# Two release paths, both ending in `npm publish`:
#
# 1. Changesets flow: a PR that adds `.changeset/*.md` files lands on main →
#    changesets/action opens a "chore: version packages" PR collecting every
#    bump with the same target version → merging that PR publishes the
#    changed packages to npm, tags them (@modplayjs/<name>@<version>) and
#    creates GitHub releases.
#
# 2. Manual bumps: pushing commits that set a package.json version which is
#    not yet on the npm registry (no .changeset files involved) publishes
#    those packages directly on the next main push — the same "collect
#    same-version commits, then release" contract without a changeset file.
#
# Requires the NPM_TOKEN repository secret (npm automation token).

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Publish anything whose (name, version) pair is missing from the
      # registry: covers manual version bumps (path 2) and is what
      # `changeset publish` runs underneath for path 1.
      - name: Publish unpublished package versions
        run: |
          set -eu
          published=0
          for pkg_dir in packages/*/; do
            name=$(node -p "require('./${pkg_dir}package.json').name")
            version=$(node -p "require('./${pkg_dir}package.json').version")
            private=$(node -p "require('./${pkg_dir}package.json').private === true")
            if [ "$private" = "true" ]; then
              echo "skip $name@$version (private)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$pkg_dir" && npm publish --provenance --access public)
            published=$((published + 1))
          done
          echo "published $published package(s)"

      # Changesets automation: consumes pending .changeset/*.md files.
      # With none pending it is a no-op; when the version PR is merged the
      # step above publishes the bumped packages (they are, by definition,
      # not yet in the registry).
      - name: Version packages (changesets PR)
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag released versions
        run: |
          set -eu
          for pkg_dir in packages/*/; do
            name=$(node -p "require('./${pkg_dir}package.json').name")
            version=$(node -p "require('./${pkg_dir}package.json').version")
            private=$(node -p "require('./${pkg_dir}package.json').private === true")
            [ "$private" = "true" ] && continue
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              continue # publish failed for this package; don't tag it
            fi
            tag="$name@$version"
            # A fresh runner has no tags fetched — query the REMOTE refspace
            # (git ls-remote), not the local one.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            git tag "$tag"
            if ! git push origin "$tag" 2>&1; then
              # Lost a race with a concurrent tagger; not an error when the
              # remote tag already points at this commit.
              remote_sha=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
              if [ "$remote_sha" != "$(git rev-parse HEAD)" ]; then
                echo "::error::tag $tag exists on the remote pointing at $remote_sha, not HEAD"
                exit 1
              fi
            fi
            echo "tagged $tag"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
