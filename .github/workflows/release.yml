name: Release

# Every push to main (except the release merge itself) opens/updates ONE
# standing version-bump PR that collects all incoming commits:
#
#   1. push commits to main (via PRs or directly)
#   2. the workflow computes, per changed package, the next version from
#      the commits since its last release tag:
#        - any "feat!:" or "BREAKING CHANGE:"  → major
#        - any "feat:"                          → minor
#        - anything else                        → patch
#      and opens/updates the "chore: version bump" PR with the version
#      edits + release notes
#   3. merging THAT PR is the release: it applies the bumps and publishes
#      every bumped package to npm (provenance), tags
#      @modplayjs/<name>@<version> and creates GitHub releases
#
# Direct pushes to main may not change package versions themselves — the
# bump is applied only by the version-bump PR merge (guarded in ci.yml).

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Collect commits / publish on version-bump merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Release merge: publish + tag, then stop ────────────────────────
      - name: Compute bumped packages on this merge
        id: release_merge
        if: >-
          startsWith(github.event.head_commit.message, 'chore: version bump')
        run: |
          set -eu
          # On the version-bump merge, every package whose version is not on
          # npm was bumped by this PR.
          : > /tmp/bumps.txt
          for f in packages/*/package.json; do
            name=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).name' "$f")
            version=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$f")
            private=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).private === true' "$f")
            [ "$private" = "true" ] && continue
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name|$version" >> /tmp/bumps.txt
            fi
          done
          echo "bumps:"; cat /tmp/bumps.txt

      - name: Publish to npm
        if: steps.release_merge.outcome == 'success'
        run: |
          set -eu
          while IFS='|' read -r name version; do
            [ -z "$name" ] && continue
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            pkg_dir=$(node -e '
              const fs = require("fs"), path = require("path");
              for (const d of fs.readdirSync("packages")) {
                const p = path.join("packages", d, "package.json");
                if (JSON.parse(fs.readFileSync(p, "utf8")).name === process.argv[1]) {
                  console.log("packages/" + d);
                  break;
                }
              }' "$name")
            [ -z "$pkg_dir" ] && { echo "::error::no package dir for $name"; exit 1; }
            echo "publishing $name@$version"
            (cd "$pkg_dir" && npm publish --provenance --access public)
          done < /tmp/bumps.txt
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag released versions
        if: steps.release_merge.outcome == 'success'
        run: |
          set -eu
          while IFS='|' read -r name version; do
            [ -z "$name" ] && continue
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::warning::$name@$version not on npm; skipping tag"
              continue
            fi
            tag="$name@$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            git tag -a "$tag" -m "$name@$version"
            if ! git push origin "$tag" 2>&1; then
              remote_sha=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
              if [ "$remote_sha" != "$(git rev-parse HEAD)" ]; then
                echo "::error::tag $tag exists on the remote pointing at $remote_sha, not HEAD"
                exit 1
              fi
            fi
            echo "tagged $tag"
          done < /tmp/bumps.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        if: steps.release_merge.outcome == 'success'
        run: |
          set -eu
          while IFS='|' read -r name version; do
            [ -z "$name" ] && continue
            dir="packages/${name#@modplayjs/}"
            tag="$name@$version"
            notes=$(git log --pretty='- %s (%h)' -20 -- "$dir")
            gh release create "$tag" --title "$name@$version" --notes "${notes:-release}" --verify-tag || true
          done < /tmp/bumps.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Ordinary push: open/update the standing version-bump PR ────────
      - name: Compute next versions from commits
        id: compute
        if: "!startsWith(github.event.head_commit.message, 'chore: version bump')"
        run: |
          set -eu
          # Per-package scan over FULL git history with no commit-count
          # bounds. The scan boundary is the last release-merge commit
          # (located via full `git log`, not a windowed search); the repo
          # root is the absolute fallback for a never-released repo.
          last_release=$(git log --pretty='%H %s'             | awk '/ chore: version bump$/{print $1; exit}')
          [ -z "$last_release" ] && last_release=$(git rev-list --max-parents=0 HEAD | tail -1)

          mkdir -p /tmp/next
          for f in packages/*/package.json; do
            name=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).name' "$f")
            version=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$f")
            private=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).private === true' "$f")
            [ "$private" = "true" ] && continue
            dir="packages/${name#@modplayjs/}"

            # Commits touching this package since its last release tag
            # (or since the scan boundary for a never-released package).
            # Both sides of the range come from full history — no `-N`
            # windows, so no commit can fall outside the scan.
            last_tag=$(git tag --list "$name@*" --sort=-v:refname | head -1)
            if [ -n "$last_tag" ]; then
              range="$last_tag..HEAD"
              commits=$(git log --pretty=%s "$range" -- "$dir")
            else
              range="$last_release..HEAD"
              commits=$(git log --pretty=%s "$range" -- "$dir")
              [ -z "$commits" ] && commits=$(git log --pretty=%s HEAD -- "$dir")
            fi
            [ -z "$commits" ] && continue   # nothing new in this package

            level=patch
            if git log --pretty=%B "$range" -- "$dir" \
                | grep -qE '^feat!|^!|BREAKING CHANGE'; then
              level=major   # feat! or a BREAKING CHANGE footer
            elif git log --pretty=%s "$range" -- "$dir" \
                | grep -qE '^feat(\(|:| )'; then
              level=minor   # features without breaking changes
            fi
            next=$(node -e '
              const [maj, min, pat] = process.argv[1].split(".").map(Number);
              const lvl = process.argv[2];
              if (lvl === "major") console.log((maj + 1) + ".0.0");
              else if (lvl === "minor") console.log(maj + "." + (min + 1) + ".0");
              else console.log(maj + "." + min + "." + (pat + 1));
            ' "$version" "$level")
            echo "$name|$version|$next|$level" >> /tmp/next/bumps.txt
          done
          if [ -s /tmp/next/bumps.txt ]; then
            {
              echo "list<<EOF"
              cat /tmp/next/bumps.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Apply version bumps (uncommitted; the action commits them)
        if: steps.compute.outputs.list != ''
        run: |
          set -eu
          : > /tmp/notes.md
          while IFS='|' read -r name current next level; do
            f="packages/${name#@modplayjs/}/package.json"
            node -e '
              const fs = require("fs");
              const p = process.argv[1], next = process.argv[2];
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = next;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            ' "$f" "$next"
            {
              echo "## $name@$next ($level, was $current)"
              echo
              last_tag=$(git tag --list "$name@*" --sort=-v:refname | head -1)
              if [ -n "$last_tag" ]; then
                git log --pretty='- %s (%h)' "$last_tag..origin/main" -- "packages/${name#@modplayjs/}"
              else
                git log --pretty='- %s (%h)' -20 origin/main -- "packages/${name#@modplayjs/}"
              fi
              echo
            } >> /tmp/notes.md
          done < /tmp/next/bumps.txt
          {
            echo "Merging this PR bumps the versions and publishes to npm:"
            echo
            echo '```'
            cat /tmp/next/bumps.txt
            echo '```'
            echo
            cat /tmp/notes.md
          } > release-notes.md

      - name: Open the version-bump PR
        if: steps.compute.outputs.list != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/version-bump
          delete-branch: true
          title: 'chore: version bump'
          body-path: release-notes.md
          commit-message: 'chore: version bump'
          labels: release
          add-paths: packages/
