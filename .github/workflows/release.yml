name: Release

# Built on the official changesets GitHub Action — no hand-rolled scripts.
#
#   1. Every PR that should bump versions adds .changeset/*.md files:
#          npx changeset            # pick packages + bump level, write notes
#          git add .changeset && git commit
#   2. Merging such a PR → changesets/action opens/updates ONE
#      "chore: version packages" PR applying the bumps to package.json +
#      package-lock.json and aggregating the changelogs.
#   3. Merging that Version Packages PR → changesets/action publishes
#      every changed package to npm (npm Trusted Publisher OIDC), tags
#      @modplayjs/<name>@<version> and creates GitHub releases.
#
# The publish uses npm Trusted Publisher (configured on npmjs.com for
# owner modplayjs / repo modplayjs / workflow release.yml) — npm ≥ 11.5.1
# exchanges the workflow's OIDC token, so no NPM_TOKEN secret is needed.

"on":
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version packages / publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Trusted Publisher publishes are exchanged by npm itself from the
      # Actions OIDC token — support landed in npm 11.5.1. node 22 ships
      # npm 10.x, which cannot authenticate a publish without a token
      # (ENEEDAUTH). Upgrade npm before anything else runs.
      - name: Upgrade npm (>= 11.5.1 required for OIDC publish)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npx turbo run build

      - name: Version & publish (changesets)
        uses: changesets/action@v1
        with:
          # version: apply bumps AND keep package-lock.json in sync inside
          # the Version Packages PR (npm ci in CI would fail otherwise).
          version: npx changeset version && npm install --package-lock-only --no-audit --no-fund
          # publish: changeset publish releases every bumped package,
          # creates the @modplayjs/<name>@<version> git tags and pushes
          # them; createGithubReleases turns each tag into a GitHub
          # release using the changeset changelogs.
          publish: npx changeset publish
          createGithubReleases: true
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
