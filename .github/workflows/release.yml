name: Release

# Built on the official changesets GitHub Action (astro pattern) — no
# hand-rolled scripts.
#
#   1. Every PR that should bump versions adds .changeset/*.md files:
#          npx changeset            # pick packages + bump level, write notes
#          git add .changeset && git commit
#      (the auto-changeset workflow does this automatically for every PR)
#   2. Merging such a PR → changesets/action opens/updates ONE
#      "chore: version packages" PR applying the bumps to package.json +
#      package-lock.json and aggregating the changelogs.
#   3. Merging that Version Packages PR → changesets/action publishes
#      every changed package to npm (npm Trusted Publisher OIDC), tags
#      @modplayjs/<name>@<version> and creates GitHub releases.
#   4. A follow-up step publishes anything changesets did NOT publish
#      (packages configured with publishConfig.registry = npm.pkg.github.com)
#      to GitHub Packages — fully automatic, no manual publish step.
#
# npmjs.com publish uses npm Trusted Publisher (configured on npmjs.com
# for owner modplayjs / repo modplayjs / workflow release.yml) — npm
# ≥ 11.5.1 exchanges the workflow's OIDC token, so no NPM_TOKEN secret
# is needed. GitHub Packages publish uses the workflow's GITHUB_TOKEN.

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release:
    name: Version packages / publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release cohort is derived from the diff against the parent
          # commit, so the default depth-1 checkout (no parent) is not
          # enough (astro pattern).
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publisher publishes are exchanged by npm itself from the
      # Actions OIDC token — support landed in npm 11.5.1. node 22 ships
      # npm 10.x, which cannot authenticate a publish without a token
      # (ENEEDAUTH). Upgrade npm before anything else runs.
      - name: Upgrade npm (>= 11.5.1 required for OIDC publish)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npx turbo run build --force

      - name: Version & publish (changesets)
        uses: changesets/action@v1
        with:
          # version: apply bumps AND keep package-lock.json in sync inside
          # the Version Packages PR (npm ci in CI would fail otherwise).
          # The action passes the whole input as args to the changeset CLI
          # (changesets v3 / cac rejects unknown options), so multi-command
          # strings fail — use the package.json "version" script instead
          # (README: "If the version script is present, this action will run
          # that script instead of changeset version").
          version: npm run version
          # publish: changeset publish releases every bumped package,
          # creates the @modplayjs/<name>@<version> git tags and pushes
          # them; createGithubReleases turns each tag into a GitHub
          # release using the changeset changelogs.
          publish: npx changeset publish
          createGithubReleases: true
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Publish to GitHub Packages anything changesets left behind:
      # packages whose publishConfig.registry points at npm.pkg.github.com.
      # changesets always publishes to registry-url (npmjs.com), so these
      # packages fail there — this step picks them up. Fully automatic;
      # no manual publish.
      - name: Publish new packages to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "changesets published: ${{ steps.changesets.outputs.publishedPackages }}"
          published=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | node -pe '
            try { JSON.parse(require("fs").readFileSync(0,"utf8")).map(p => p.name).join("\n") } catch { "" }')

          for d in packages/*/; do
            name=$(node -pe "JSON.parse(require('fs').readFileSync('$d/package.json','utf8')).name")
            private=$(node -pe "JSON.parse(require('fs').readFileSync('$d/package.json','utf8')).private || false")
            [ "$private" = "false" ] || continue

            # Skip what changesets already published this run.
            if printf '%s\n' "$published" | grep -qx "$name"; then
              echo "skip $name (changesets published it to npmjs.com)"
              continue
            fi

            # Only packages whose publishConfig targets GitHub Packages.
            reg=$(node -pe "JSON.parse(require('fs').readFileSync('$d/package.json','utf8')).publishConfig?.registry || ''")
            if [ "$reg" != "https://npm.pkg.github.com" ]; then
              echo "skip $name (no GitHub Packages publishConfig)"
              continue
            fi

            # Publish to GitHub Packages with the workflow token.
            echo "publishing $name → npm.pkg.github.com"
            ( cd "$d" && npm publish \
              --registry=https://npm.pkg.github.com \
              --//npm.pkg.github.com/:_authToken="$GH_TOKEN" \
              --access public ) || echo "::warning::$name publish failed (may already exist)"
          done
