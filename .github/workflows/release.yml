name: Release

# Publishes all @modplayjs/* packages to GitHub Packages (npm.pkg.github.com).
#
# Flow:
#   1. Feature PRs carry .changeset/*.md files (auto-generated by
#      auto-changeset.yml from every PR).
#   2. Merging a PR → changesets/action opens/updates a "chore: version
#      packages" PR applying version bumps + changelogs.
#   3. Merging that Version Packages PR → this workflow publishes every
#      bumped package to GitHub Packages (npm.pkg.github.com) and creates
#      GitHub releases.
#
# All packages use the public GitHub Packages registry (npm.pkg.github.com).
# npmjs.com was dropped: Trusted Publisher OIDC doesn't work for first-time
# publishes of new packages (E404), and the account has 2FA auth-and-writes
# which blocks headless publishes. GitHub Packages uses the workflow's
# GITHUB_TOKEN — no secrets, no 2FA, fully automatic.

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version packages / publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@modplayjs'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npx turbo run build --force

      - name: Version & publish (changesets)
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset publish
          createGithubReleases: true
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
