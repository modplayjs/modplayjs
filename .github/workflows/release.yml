name: Release

# The ONLY release path is the changesets flow:
#
#   1. Every version bump starts as a PR adding `.changeset/*.md` files
#      (`npx changeset` locally).
#   2. When such a PR lands on main, changesets/action opens the
#      "chore: version packages" PR that applies the bumps to package.json
#      and aggregates changelogs.
#   3. Merging THAT PR publishes to npm (--provenance), tags
#      @modplayjs/<name>@<version> and creates GitHub releases.
#
# Direct pushes that bump a version without a changeset file never reach
# npm: the publish step below only runs on the changesets version-PR merge
# (detected via git log), and the version-guard job in CI fails any other
# version bump. See .github/workflows/ci.yml (version-guard).
#
# Requires the NPM_TOKEN repository secret (npm automation token).

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    name: Version and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Detect "merging the changesets version PR": the merge commit's
      # subject is exactly that PR's title. Anything else (ordinary
      # feature/fix merges) must not publish.
      - name: Detect changesets version-PR merge
        id: version_pr
        run: |
          set -eu
          subject=$(git log -1 --pretty=%s HEAD)
          if [ "$subject" = "chore: version packages" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # `changeset publish` is a no-op for every (name, version) already in
      # the registry, so re-running it is safe. It is the ONLY step that
      # ever touches npm.
      - name: Publish to npm
        if: steps.version_pr.outputs.publish == 'true'
        run: npx changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: '0'

      - name: Tag released versions
        if: steps.version_pr.outputs.publish == 'true'
        run: |
          set -eu
          for pkg_dir in packages/*/; do
            name=$(node -p "require('./${pkg_dir}package.json').name")
            version=$(node -p "require('./${pkg_dir}package.json').version")
            private=$(node -p "require('./${pkg_dir}package.json').private === true")
            [ "$private" = "true" ] && continue
            # Only tag versions this changeset run actually published: the
            # bump must exist in HEAD and the version must now be on npm.
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              continue
            fi
            tag="$name@$version"
            # A fresh runner has no tags fetched — query the REMOTE refspace
            # (git ls-remote), not the local one.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            git tag "$tag"
            if ! git push origin "$tag" 2>&1; then
              # Lost a race with a concurrent tagger; not an error when the
              # remote tag already points at this commit.
              remote_sha=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
              if [ "$remote_sha" != "$(git rev-parse HEAD)" ]; then
                echo "::error::tag $tag exists on the remote pointing at $remote_sha, not HEAD"
                exit 1
              fi
            fi
            echo "tagged $tag"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Consumes pending .changeset/*.md files: opens/updates the
      # "chore: version packages" PR. No-op when none are pending.
      - name: Open version-packages PR
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
