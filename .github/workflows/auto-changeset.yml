name: Auto changeset

# Generates changeset files automatically so the release workflow can
# pick them up. Triggers on both PRs and direct pushes to main (plus a
# manual workflow_dispatch for reruns).
#
#   PR title / commit message              → changeset
#   ─────────────────────────────────────────────────────────────
#   "feat: …" / "feat(scope): …"           → minor
#   "feat!: …" / "fix!: …" / "BREAKING …"  → major
#   "fix: …", "chore: …", anything else    → patch
#
# Packages are detected from the changed files. On PRs the changeset is
# pushed to the PR branch; on direct pushes it covers ALL commits since
# the last changeset run (the previous "chore(changeset):" commit), so a
# multi-commit push gets one changeset listing every touched package at
# the highest bump level found in the range. A push that introduces a new
# publishable package bumps it at least minor. The release workflow picks
# up pending changesets when you merge the auto-generated
# "chore: version packages" PR.

on:
  push:
    branches: ['main']
    paths-ignore:
      - '.changeset/**'
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-changeset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # Skip the version bot's own PR (branch from changesets/action's
    # `commit:` = "chore: version packages") and direct pushes on main
    # that are version-packages merges.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref != 'chore/version-packages') ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore: version packages')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changeset file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_USER: ${{ github.event.pull_request.user.login || github.event.pusher.name }}
          IS_PUSH: ${{ github.event_name != 'pull_request_target' }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          # workflow_dispatch rerun (IS_PUSH=1 with no push payload): force
          # the grep fallback by pretending there is no "before" SHA.
          FORCE_RANGE_MODE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -eu
          node <<'JSEOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const isPush = process.env.IS_PUSH === 'true';
          const pushBefore = process.env.PUSH_BEFORE || '';
          const forceRange = process.env.FORCE_RANGE_MODE === '1';
          const title = isPush
            ? (process.env.COMMIT_TITLE || '')
            : (process.env.PR_TITLE || '');
          const body = process.env.PR_BODY || '';
          const pr = process.env.PR_NUMBER || '';
          const user = process.env.PR_USER || 'unknown';

          // Range anchor for direct pushes: prefer the SHA just before the
          // push (github.event.before), which covers exactly this push. If
          // unavailable (workflow_dispatch rerun, or force-push where the
          // "before" SHA is all zeros), fall back to the newest
          // "chore(changeset): auto-generated from push" commit in history —
          // i.e. everything since the last successful changeset run.
          let base = forceRange ? '' : pushBefore;
          if (isPush && (!base || /^0+$/.test(base))) {
            base = require('child_process')
              .execSync("git log --format=%H --grep='^chore(changeset): auto-generated from push' -1")
              .toString().trim();
          }
          if (!isPush) base = '';

          // For direct pushes, cover every commit in the range — not just
          // HEAD — so multi-commit pushes don't lose changesets.
          let msgs = [];
          if (isPush) {
            const range = `${base}..HEAD`;
            msgs = require('child_process')
              .execSync(`git log --format=%s ${range}`)
              .toString().split('\n').filter(Boolean);
            if (msgs.length === 0) msgs = [require('child_process')
              .execSync('git log -1 --pretty=%s').toString().trim()];
          } else {
            msgs = [title];
          }
          // "PR title" for pushes: the range's oldest non-chore commit
          // subject (the headline change of the push; msgs is newest-first).
          const summary = (msgs.slice().reverse().find(m => !/^chore(\(|:)/.test(m)) || msgs[0])
            .replace(/^\w+(\([^)]*\))?!?:\s*/, '') || msgs[0];

          // Bump level from conventional-commit messages: the highest level
          // found anywhere in the range wins.
          let level = 'patch';
          for (const m of msgs) {
            if (/^feat!|^fix!|BREAKING CHANGE/.test(m) || /!:\s/.test(m)) { level = 'major'; break; }
            if (/^feat(\(|:| )/.test(m)) level = 'minor';
          }

          // For PRs: packages from the PR diff. For pushes: packages from
          // the full commit range (files changed anywhere since the last
          // changeset run).
          let dirs;
          if (isPush) {
            const range = `${base}..HEAD`;
            const files = execSync(`git diff --name-only ${range}`, { encoding: 'utf8' }).split('\n');
            dirs = [...new Set(files.map(l => l.match(/^packages\/([^/]+)\//)?.[1]).filter(Boolean))];
          } else {
            const files = execSync(`gh pr diff ${pr} --name-only`, { encoding: 'utf8' }).split('\n');
            dirs = [...new Set(files.map(l => l.match(/^packages\/([^/]+)\//)?.[1]).filter(Boolean))];
          }

          const pkgs = dirs
            .filter(d => fs.existsSync(`packages/${d}/package.json`))
            .map(d => {
              const j = JSON.parse(fs.readFileSync(`packages/${d}/package.json`, 'utf8'));
              return j.private ? null : j.name;
            })
            .filter(Boolean);

          if (pkgs.length === 0) {
            console.log('::notice::no publishable packages touched — no changeset needed');
            process.exit(0);
          }

          // "PR title" for pushes: the range's oldest non-chore commit
          // subject (the headline change of the push; msgs is newest-first).
          // Changeset body for pushes: a bullet per non-chore commit in the
          // range (newest last), so multi-commit pushes are fully described.
          let text;
          if (isPush) {
            const lines = msgs
              .filter(m => !/^chore(\(|:)/.test(m))
              .reverse()
              .map(m => m.replace(/^\w+(\([^)]*\))?!?:\s*/, ''));
            text = (lines.length ? lines : [msg])
              .map(l => `- ${l} (${isPush ? 'direct push' : `PR #${pr}`})`)
              .join('\n');
          } else {
            text = `${summary} (PR #${pr})`;
          }
          const frontmatter = pkgs.map(p => `'${p}': ${level}`).join('\n');
          const name = isPush ? `push-${Date.now()}` : `auto-pr-${pr}`;
          const author = process.env.PR_USER || 'bitti09';
          // Author line only — the GitHub changelog generator prefixes
          // "Thanks @<author>!" from the commit author, so the changeset
          // body stays free of redundant credit text.
          fs.writeFileSync(`.changeset/auto-${isPush ? 'push' : 'pr'}-${isPush ? Date.now() : pr}.md`,
            `---\n${frontmatter}\n---\n\n${text}\n`);
          console.log('changeset:', level, '→', pkgs.join(', '));
          JSEOF
          ls .changeset/

      - name: Commit & push the changeset
        run: |
          set -eu
          # Commit as the maintainer's noreply identity: changesets'
          # GitHub changelog generator resolves the commit author to a
          # GitHub user for the "Thanks @user!" credit. The default
          # github-actions/web-flow identity would render as @web-flow.
          git config user.name "Bitti09"
          git config user.email "Bitti09@users.noreply.github.com"
          git add .changeset/
          if git diff --cached --quiet; then
            echo "changeset unchanged or none needed"
          else
            git commit -m "chore(changeset): auto-generated from ${{ github.event_name }}"
            git push
          fi
