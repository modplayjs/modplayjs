name: Auto changeset

# Removes the manual `npx changeset` step entirely: every PR gets a
# changeset file generated from its title and pushed to the PR branch.
#
#   PR title                                → changeset
#   ─────────────────────────────────────────────────────────────
#   "feat: …" / "feat(scope): …"            → minor
#   "feat!: …" / "fix!: …" / "BREAKING …"   → major
#   "fix: …", "chore: …", anything else     → patch
#
# Packages are detected from the files the PR touches; the changesets
# release workflow (release.yml) picks the file up as usual:
# merge the PR → "chore: version packages" PR → merge → publish.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    # Skip the release bot's own PRs.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref != 'chore/version-bump'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changeset file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const title = process.env.PR_TITLE || '';
          const body = process.env.PR_BODY || '';
          const pr = process.env.PR_NUMBER;

          // bump level from conventional-commit title
          let level = 'patch';
          if (/^feat!|^fix!|BREAKING CHANGE/.test(title + '\n' + body) || /!:\s/.test(title)) level = 'major';
          else if (/^feat(\(|:| )/.test(title)) level = 'minor';

          // packages touched by the PR diff
          const files = execSync(`gh pr diff ${pr} --name-only`, { encoding: 'utf8' }).split('\n');
          const dirs = [...new Set(files.map(l => l.match(/^packages\/([^/]+)\//)?.[1]).filter(Boolean))];
          const pkgs = dirs
            .filter(d => fs.existsSync(`packages/${d}/package.json`))
            .map(d => {
              const j = JSON.parse(fs.readFileSync(`packages/${d}/package.json`, 'utf8'));
              return j.private ? null : j.name;
            })
            .filter(Boolean);

          if (pkgs.length === 0) {
            console.log('::notice::no publishable packages touched — no changeset needed');
            process.exit(0);
          }

          const summary = title.replace(/^\w+(\([^)]*\))?!?:\s*/, '') || title;
          const frontmatter = pkgs.map(p => `'${p}': ${level}`).join('\n');
          fs.writeFileSync(`.changeset/auto-pr-${pr}.md`,
            `---\n${frontmatter}\n---\n\n${summary} (PR #${pr}, by @${process.env.PR_USER})\n`);
          console.log('changeset:', level, '→', pkgs.join(', '));
          EOF
          ls .changeset/

      - name: Commit & push the changeset to the PR branch
        run: |
          set -eu
          git config user.name "modplayjs-changeset-bot"
          git config user.email "noreply@github.com"
          git add .changeset/
          if git diff --cached --quiet; then
            echo "changeset unchanged or none needed"
          else
            git commit -m "chore(changeset): auto-generated from PR #${{ github.event.pull_request.number }}"
            git push
          fi
