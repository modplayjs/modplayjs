name: CI

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Turbo scopes to what actually changed (input hashing + the
      # workspace dependency graph); a no-op PR hits the remote cache.
      - name: Build
        run: npx turbo run build typecheck

  # A version bump may only enter main through a PR (the bump is applied
  # in the feature PR itself). The release workflow then opens the
  # "chore: release" PR whose merge is the only thing that publishes.
  # This job fails direct pushes to main that bump versions outside the
  # release merge.
  version-guard:
    name: Version bump guard
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject direct-push version bumps (bumps go through PRs)
        run: |
          set -eu
          # PRs are exactly where bumps belong — nothing to check here.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR: version bumps allowed (they ride the PR to main)"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "initial push; nothing to compare"
            exit 0
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi

          # The release merge is the one direct-push commit allowed to
          # carry version changes (it merges the bot PR to main).
          subject=$(git log -1 --pretty=%s HEAD)
          if printf '%s' "$subject" | grep -q '^chore: release'; then
            echo "release merge; bumps allowed"
            exit 0
          fi

          bumped=0
          for f in packages/*/package.json; do
            before=$(git show "$base:$f" 2>/dev/null \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' \
              2>/dev/null || echo "")
            after=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$f")
            if [ -n "$before" ] && [ "$before" != "$after" ]; then
              echo "::error::file=$f::direct-push version bump $before -> $after; bump in a PR instead"
              bumped=1
            fi
          done
          if [ "$bumped" != "0" ]; then
            echo "::error::version bumps must be merged via a PR; the release PR opens automatically"
            exit 1
          fi
          echo "no direct-push bumps"
