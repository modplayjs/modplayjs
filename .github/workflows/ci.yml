name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions: {}

# Cancel older in-progress runs on the same branch (astro pattern: key on
# head_ref for PRs so re-pushes supersede, full ref for pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Turbo scopes to what actually changed (input hashing + the
      # workspace dependency graph); a no-op PR hits the remote cache.
      # Build and typecheck run as one turbo invocation.
      - name: Build & typecheck
        run: npx turbo run build typecheck

      # The engine bundles and the XR module tree are committed, so a build
      # without node still ships the last generated version. That only holds
      # if regenerating them reproduces the committed bytes: a tool bump or a
      # source change that was not rebuilt leaves the APK and the catalog
      # disagreeing. Rebuild and fail on any difference, including new files.
      - name: Generated engine assets are current
        run: |
          set -eu
          (cd apps/android && npm run build:engine)
          (cd apps/xr && npm run build:engine && npm run build:modules)
          if [ -n "$(git status --porcelain -- apps/android/app/src/main/assets apps/xr/app/src/main/assets)" ]; then
            git status --short -- apps/android/app/src/main/assets apps/xr/app/src/main/assets
            echo "::error::generated engine assets are stale; rebuild and commit them"
            exit 1
          fi

  # A .gitignore cannot help once a file is tracked: the rule has no effect on
  # files already in the index, which is exactly how the XR upload keystore
  # ended up in this repository. This job looks at what git actually tracks,
  # not at what is ignored, and also rejects a private key that slipped into
  # an APK asset directory.
  secrets-guard:
    name: No tracked key material
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject tracked key material
        run: |
          set -eu
          tracked=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks|keystore)$|(^|/)keystore\.properties$|(^|/)engine-keys/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::key material is tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "no tracked key material"

      - name: Reject keys inside app assets
        run: |
          set -eu
          assets=$(git ls-files 'apps/*/app/src/main/assets/*' | grep -Ei '\.(pem|key|p12|pfx|jks)$' || true)
          if [ -n "$assets" ]; then
            echo "::error::key material inside app assets (it would ship in the APK):"
            echo "$assets"
            exit 1
          fi
          echo "no key material in assets"

      # The tracked-file check above cannot see the case this guards against: a
      # key injected into the workspace at run time is untracked, and once it is
      # on disk an artifact or cache step can take it. Signing belongs on the
      # publishing machine, so no workflow may reference the private key at all.
      # Adding it here is a deliberate decision that has to remove this step.
      - name: Reject signing-key use in CI
        run: |
          set -eu
          # Split literals so this step's own text cannot match itself.
          pat='MODPLAY_ENGINE_SIGNIN''G_KEY=|engine-keys''/private'
          hits=$(grep -rnE "$pat" .github/workflows/ || true)
          if [ -n "$hits" ]; then
            echo "::error::a workflow references the engine signing key:"
            echo "$hits"
            echo "Sign the catalog on the publishing machine; CI builds with the public key only."
            exit 1
          fi
          echo "no workflow uses the engine signing key"

      # An artifact path that covers apps/xr/build/ also covers
      # build/engine-keys/ if anyone ever injects one there.
      - name: Reject artifact paths over the XR build tree
        run: |
          set -eu
          bad=$(grep -rn 'path:.*apps/xr/build' .github/workflows/ | grep -v 'engine-catalog' || true)
          if [ -n "$bad" ]; then
            echo "::error::artifact path covers the whole XR build tree:"
            echo "$bad"
            echo "Upload apps/xr/build/engine-catalog instead."
            exit 1
          fi
          echo "no artifact path covers the XR build tree"

  # A version bump may only enter main through a PR (the bump is applied
  # in the feature PR itself, or via the changesets "version packages"
  # merge). This job fails direct pushes to main that bump versions
  # outside the release merge.
  version-guard:
    name: Version bump guard
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject direct-push version bumps
        run: |
          set -eu
          # PRs are exactly where bumps belong.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR: version bumps allowed"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "initial push; nothing to compare"
            exit 0
          fi
          # The changesets release merge is the only direct push allowed
          # to carry version changes.
          if git log -1 --pretty=%s HEAD | grep -q '^chore: version packages'; then
            echo "changesets version-packages merge; bumps allowed"
            exit 0
          fi
          bumped=0
          for f in packages/*/package.json; do
            before=$(git show "$base:$f" 2>/dev/null \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' \
              2>/dev/null || echo "")
            after=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$f")
            if [ -n "$before" ] && [ "$before" != "$after" ]; then
              echo "::error::file=$f::direct-push version bump $before -> $after"
              bumped=1
            fi
          done
          [ "$bumped" = "0" ] || { echo "::error::bumps must go through a PR"; exit 1; }
          echo "no direct-push bumps"
