name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android/**'
      - 'packages/**'
      - '.github/workflows/android.yml'

jobs:
  app:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;29.0.14206865" "cmake;4.1.2"
      - name: Install JS deps
        run: npm ci
      - name: Build JS packages
        run: npm run build
      - name: Build engine bundle
        run: npm run build:engine -w @modplayjs/android
      - name: Fetch prebuilt V8
        run: ./apps/android/scripts/fetch-v8-prebuilt.sh arm64-v8a build/v8-prebuilt
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleDebug \
            -Pv8Dir="$GITHUB_WORKSPACE/build/v8-prebuilt/android-arm64-v8a"
      - name: 16 KB check
        run: |
          python3 - <<'PY'
          import glob, struct
          found = False
          for f in glob.glob('apps/android/app/build/**/libmodplay_v8.so', recursive=True):
              found = True
              with open(f,'rb') as h:
                  assert h.read(4) == b'\x7fELF', f
                  h.seek(0x20); phoff = struct.unpack('<Q', h.read(8))[0]
                  h.seek(0x36); phentsize = struct.unpack('<H', h.read(2))[0]
                  h.seek(0x38); phnum = struct.unpack('<H', h.read(2))[0]
                  for i in range(phnum):
                      h.seek(phoff + i*phentsize)
                      vals = struct.unpack('<IIQQQQQQ', h.read(56))
                      if vals[0] == 1:
                          assert vals[7] >= 16384, (f, vals[7])
              print('ok', f)
          assert found, 'libmodplay_v8.so not found'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
