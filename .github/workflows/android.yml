name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android/**'
      - 'packages/**'
      - '.github/workflows/android.yml'

jobs:
  app:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;29.0.14206865" "cmake;4.1.2"
      - name: Install JS deps
        run: npm ci
      - name: Build JS packages
        run: npm run build
      - name: Build engine bundle
        run: npm run build:engine -w @modplayjs/android
      - name: Fetch prebuilt V8
        run: node apps/android/scripts/fetch-v8.mjs arm64-v8a
      - uses: gradle/actions/setup-gradle@v6

      # A debug APK is signed with `~/.android/debug.keystore`, which Gradle
      # creates per machine and per user. A fresh runner therefore produces a
      # *different* debug identity on every run, and Android refuses to update an
      # installed app whose signing certificate differs:
      #
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE: ... signatures do not match
      #
      # Restoring the maintainer's own keystore makes CI artifacts interchangeable
      # with local builds - and with each other. It is a debug key, never the
      # upload key: debug builds carry the .debug package suffix.
      #
      # Create the secret once, on the machine that builds locally:
      #
      #   base64 -w0 ~/.android/debug.keystore        # Linux/macOS
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes(
      #     "$env:USERPROFILE\.android\debug.keystore"))   # Windows PowerShell
      #
      # and store it as the repository secret ANDROID_DEBUG_KEYSTORE. Without it
      # (a pull request from a fork, or an unconfigured repository) the build still
      # runs, with a warning and an unshareable identity.
      - name: Restore the debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -eu
          if [ -z "${DEBUG_KEYSTORE:-}" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; this build gets a fresh debug key, so its APK cannot update an install made elsewhere"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # Print the identity, so a wrong secret is visible in the log instead of
          # turning into a mysterious install failure on someone's phone.
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -E "Owner:|SHA256:" || true

      - name: Assemble debug
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleDebug \
            -Pv8Dir="$GITHUB_WORKSPACE/build/v8-prebuilt/android-arm64-v8a"

      # The same identity the keystore step printed above. If these two do not
      # match, the APK cannot update a local build and the reason is here.
      - name: Show the APK signature
        run: |
          set -eu
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs apps/android/app/build/outputs/apk/debug/*.apk \
            | grep -E "certificate (DN|SHA-256 digest)" || true
      - name: 16 KB check
        run: |
          python3 - <<'PY'
          import glob, struct
          found = False
          for f in glob.glob('apps/android/app/build/**/libmodplay_v8.so', recursive=True):
              found = True
              with open(f,'rb') as h:
                  assert h.read(4) == b'\x7fELF', f
                  h.seek(0x20); phoff = struct.unpack('<Q', h.read(8))[0]
                  h.seek(0x36); phentsize = struct.unpack('<H', h.read(2))[0]
                  h.seek(0x38); phnum = struct.unpack('<H', h.read(2))[0]
                  for i in range(phnum):
                      h.seek(phoff + i*phentsize)
                      vals = struct.unpack('<IIQQQQQQ', h.read(56))
                      if vals[0] == 1:
                          assert vals[7] >= 16384, (f, vals[7])
              print('ok', f)
          assert found, 'libmodplay_v8.so not found'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
