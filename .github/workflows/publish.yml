name: Publish

# Publishes bumped @modplayjs/* packages to GitHub Packages
# (npm.pkg.github.com) when the rolling "chore: version packages" PR is
# merged. Scoped: only packages whose version changed in the merge
# commit are built (`turbo --filter`); turbo rebuilds their workspace
# dependencies from the dependency graph automatically.
#
# Flow: feature PR → changesets on main → version-pr.yml keeps the
# rolling PR updated → merging it produces the "chore: version packages"
# commit → this workflow builds + publishes just those packages.
#
# Registry is GitHub Packages only (workflow GITHUB_TOKEN, no secrets,
# no 2FA). GitHub releases are created per published package by
# `changeset publish` (createGithubReleases in version-pr.yml is false).

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & publish changed packages
    # Only the version-packages merge (and manual dispatch) reaches the
    # registry; every other push to main is a no-op here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: version packages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@modplayjs'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Detect bumped packages
        id: bumped
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -eu
          # workflow_dispatch: build everything. Otherwise diff the merge
          # commit against its parent and take the packages whose version
          # actually changed.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "filters=--force" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          bumped=()
          for f in packages/*/package.json; do
            before=$(git show "$BASE:$f" 2>/dev/null \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' \
              2>/dev/null || echo "")
            after=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$f")
            if [ -n "$before" ] && [ "$before" != "$after" ]; then
              name=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).name' "$f")
              if ! node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).private' "$f" | grep -q true; then
                bumped+=("$name")
                echo "::notice::$f $before -> $after ($name)"
              fi
            fi
          done
          if [ "${#bumped[@]}" -eq 0 ]; then
            echo "::notice::no package versions changed; nothing to publish"
            echo "filters=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          filters=""
          for p in "${bumped[@]}"; do
            filters="$filters --filter=$p"
          done
          echo "filters=$filters" >> "$GITHUB_OUTPUT"

      - name: Build bumped packages
        if: steps.bumped.outputs.filters != ''
        run: npx turbo run build ${{ steps.bumped.outputs.filters }}

      - name: Publish changed packages
        if: steps.bumped.outputs.filters != ''
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
