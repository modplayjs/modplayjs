<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modplayjs</title>
    <meta name="description" content="Tracker module player (MOD/S3M/XM/IT and more) built on modplayjs" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="min-h-screen bg-base-300 text-base-content">
    <!-- Service worker (sw.js): COI headers for the SharedArrayBuffer
         audio transport, precaching and auto-update. Registered in
         src/pwa.ts; controls this page from the second visit on. -->

    <!-- ══ player bar: fixed at the top, full width ════════════════════ -->
    <header id="playerbar" class="sticky top-0 z-30 border-b border-base-300 bg-base-100/95 backdrop-blur">
      <div class="w-full px-3 lg:px-5 py-2.5 flex flex-col gap-2">

        <!-- row 1: identity + file + transport -->
        <div class="flex items-center gap-x-3 gap-y-2 flex-wrap">
          <span class="font-bold tracking-tight leading-none">
            modplay<span class="text-secondary">js</span>
          </span>
          <span id="buildhash" class="badge badge-ghost badge-sm font-mono" title="build"></span>

          <label class="sr-only" for="file">Module files</label>
          <input type="file" id="file" multiple
            accept=".mod,.s3m,.xm,.it,.mtm,.stm,.669,.sfx,.digi,.asylum,.ice,.mdl,.ptm,.okt,.med,.mmd,.far,.pow,.p61,.utz"
            class="sr-only" />

          <button id="filebtn" type="button" class="btn btn-ghost btn-sm" title="Add module files to the playlist">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
            </svg>
            add files
          </button>

          <div class="join ml-auto">
            <button id="play" disabled class="btn btn-primary btn-sm join-item w-16">Play</button>
            <button id="pause" disabled class="btn btn-sm join-item w-16">Pause</button>
            <button id="stop" disabled class="btn btn-sm join-item w-14">Stop</button>
            <button id="fullscreen" class="btn btn-sm join-item btn-square hidden" title="Toggle fullscreen" aria-label="Toggle fullscreen">
              <svg id="fs-enter-icon" xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/>
              </svg>
              <svg id="fs-exit-icon" xmlns="http://www.w3.org/2000/svg" class="size-4 hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M9 4H7v5H2v2h7V4zm12 7h-5V4h-2v7h7V7v4zM9 20H2v-7h2v5h5v2zm12-5v5h-7v-2h5v-3h2z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- row 2: seek + time + volume -->
        <div class="flex items-center gap-3">
          <span id="timecur" class="font-mono text-sm tabular-nums w-12 text-right">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" disabled
            class="range range-xs range-primary grow" aria-label="Seek" />
          <span id="timerem" class="font-mono text-sm tabular-nums w-14 opacity-80">-0:00</span>

          <div class="flex items-center gap-2 border-l border-base-300 pl-3 w-40 min-w-36">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4 opacity-70 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM16.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
            </svg>
            <input type="range" id="volume" min="0" max="100" value="100"
              class="range range-xs grow" aria-label="Volume" />
            <span id="volumev" class="font-mono text-xs tabular-nums w-8 text-right opacity-80">100</span>
          </div>

          <label class="flex items-center gap-2 text-xs border-l border-base-300 pl-3 w-36 min-w-32">
            <span class="opacity-50">pan</span>
            <input type="range" id="pansep" min="0" max="100" value="50"
              class="range range-xs grow" aria-label="Pan separation" />
            <span id="pansepv" class="font-mono tabular-nums opacity-70 w-7 text-right">50</span>
          </label>
        </div>

        <!-- row 3: song meta + channel strip -->
        <div class="flex items-center gap-x-3 gap-y-1 flex-wrap text-xs min-h-6">
          <span id="status" role="status" class="opacity-70 whitespace-pre-wrap">no file loaded</span>
          <div id="chanstrip" class="flex flex-wrap gap-1 ml-auto"></div>
        </div>
      </div>
    </header>

    <!-- ══ app grid ════════════════════════════════════════════════════ -->
    <!-- Pattern view toggles the middle column: #appgrid toggles between
         the 3-col layout (pattern on) and 2-col (pattern off). -->
    <main class="mx-auto w-full px-3 lg:px-5 py-4">
      <div id="appgrid" class="grid gap-4 grid-cols-1 lg:grid-cols-2 items-start">

        <!-- left column: playlist + view options + file information -->
        <div class="flex flex-col gap-4 min-w-0">
          <section class="card bg-base-100 shadow-sm border border-base-300" id="playlistcard">
            <div class="card-body p-3 gap-2">
              <div class="flex items-center justify-between">
                <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">playlist</h2>
                <div class="flex items-center gap-1">
                  <span id="plsize" class="text-[0.65rem] opacity-50 font-mono" title="cached bytes"></span>
                  <button id="plclear" class="btn btn-ghost btn-xs" title="Remove all entries">clear</button>
                </div>
              </div>
              <div id="pllist" class="flex flex-col gap-0.5 overflow-auto max-h-56 -mx-1 px-1" role="listbox" aria-label="playlist">
                <div id="plempty" class="text-[0.72rem] opacity-50 py-2 text-center">
                  drop module files here or use the file picker
                </div>
              </div>
            </div>
          </section>

          <section class="card bg-base-100 shadow-sm border border-base-300">
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">view options</h2>
              <div class="flex flex-col gap-1.5 text-xs">
                <label class="flex items-center justify-between cursor-pointer gap-2 py-0.5">
                  <span class="opacity-70" title="Autoscroll pattern view and order list to the active row">follow</span>
                  <input type="checkbox" id="follow" checked class="toggle toggle-sm toggle-primary" />
                </label>
                <label class="flex items-center justify-between cursor-pointer gap-2 py-0.5">
                  <span class="opacity-70" title="Show the tracker pattern view">pattern</span>
                  <input type="checkbox" id="patternview" class="toggle toggle-sm toggle-primary" />
                </label>
                <label class="flex items-center justify-between cursor-pointer gap-2 py-0.5" title="Hide trailing padding dots in instrument/sample names">
                  <span class="opacity-70">strip dots</span>
                  <input type="checkbox" id="stripdots" class="toggle toggle-sm" />
                </label>
                <label class="flex items-center justify-between cursor-pointer gap-2 py-0.5" title="Switch light/dark theme">
                  <span class="opacity-70">dark</span>
                  <input type="checkbox" id="thememode" class="toggle toggle-sm" checked />
                </label>
              </div>
            </div>
          </section>

          <section class="card bg-base-100 shadow-sm border border-base-300">
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">file information</h2>
              <div id="info" class="overflow-auto max-h-[26rem] text-[0.72rem] leading-relaxed">—</div>
            </div>
          </section>

        </div>

        <!-- center column: message (when present) + pattern -->
        <section class="min-w-0 flex flex-col gap-4" id="patterncol" hidden>
          <section class="card bg-base-100 shadow-sm border border-base-300" id="messagesection" hidden>
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">message</h2>
              <pre id="message" class="m-0 whitespace-pre-wrap font-mono text-[0.7rem] leading-relaxed overflow-auto max-h-64 text-center">—</pre>
            </div>
          </section>
          <div class="flex items-center justify-between mb-2 gap-2" id="patternlegend">
            <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">
              pattern <span id="patnum" class="badge badge-primary badge-sm align-middle font-mono"></span>
            </h2>
            <div class="hidden md:flex items-center gap-x-3 gap-y-1 text-[0.65rem] opacity-70" role="group" aria-label="column legend">
              <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-note">C-4</span>note</span>
              <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-ins">01</span>ins</span>
              <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-vol">64</span>vol</span>
              <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-fx">F0A</span>fx</span>
              <span class="inline-flex items-center gap-1"><span class="legend-swatch legend-empty">...</span>—</span>
            </div>
          </div>
          <div class="card bg-base-100 shadow-sm border border-base-300" id="pattern">
            <div id="patbody" class="card-body p-0" role="group" aria-label="pattern data">
              <div id="pathead"></div>
              <div id="patrows"></div>
            </div>
          </div>
        </section>

        <!-- right column: orders + instruments + samples -->
        <div class="flex flex-col gap-4 min-w-0">
          <section class="card bg-base-100 shadow-sm border border-base-300">
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">orders</h2>
              <div id="ordlist" class="font-mono text-[0.7rem] leading-relaxed overflow-auto max-h-48 whitespace-pre">—</div>
            </div>
          </section>
          <section class="card bg-base-100 shadow-sm border border-base-300">
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">instruments</h2>
              <div id="inslist" class="font-mono text-[0.7rem] leading-relaxed overflow-auto max-h-56">—</div>
            </div>
          </section>
          <section class="card bg-base-100 shadow-sm border border-base-300">
            <div class="card-body p-3 gap-2">
              <h2 class="text-[0.65rem] font-semibold uppercase tracking-[0.18em] opacity-50">samples</h2>
              <div id="samplist" class="font-mono text-[0.7rem] leading-relaxed overflow-auto max-h-56">—</div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
