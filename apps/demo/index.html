<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modplayjs demo</title>
  </head>
  <body class="min-h-screen bg-base-300 text-base-content">
    <!-- coi-serviceworker: re-serves the page with COOP/COEP headers so
         SharedArrayBuffer (the SAB audio transport) works on GitHub Pages,
         which cannot set response headers. Reloads once to take control. -->
    <script src="coi-serviceworker.js?v=2"></script>
    <main class="mx-auto w-full max-w-none px-4 py-6 lg:px-8">
      <header class="mb-4">
        <h1 class="text-2xl font-bold tracking-tight">modplayjs <span class="text-secondary">demo</span></h1>
      </header>

      <div class="card bg-base-100 shadow-sm mb-4">
        <div class="card-body gap-4 py-4">
          <div class="flex flex-wrap items-center gap-3">
            <input type="file" id="file" accept=".mod,.s3m,.xm,.it"
              class="file-input file-input-bordered file-input-sm w-full max-w-xs" />
            <div class="join">
              <button id="play" disabled class="btn btn-primary btn-sm join-item">Play</button>
              <button id="pause" disabled class="btn btn-sm join-item">Pause</button>
              <button id="stop" disabled class="btn btn-sm join-item">Stop</button>
            </div>
            <label class="label cursor-pointer gap-2 text-sm">
              <span>follow</span>
              <input type="checkbox" id="follow" checked class="toggle toggle-sm toggle-primary" />
            </label>
            <label class="label cursor-pointer gap-2 text-sm" title="Hide the trailing padding dots in instrument and sample names">
              <span>strip dots</span>
              <input type="checkbox" id="stripdots" class="toggle toggle-sm" />
            </label>
            <label class="flex items-center gap-2 text-sm">
              <span class="opacity-70">pan sep</span>
              <input type="range" id="pansep" min="0" max="200" value="100"
                class="range range-xs range-primary w-28" />
              <span id="pansepv" class="badge badge-ghost">100</span>
            </label>
          </div>
          <div class="flex flex-wrap items-center gap-1">
            <span class="text-xs opacity-60 mr-1">channels:</span>
            <div id="chanstrip" class="flex flex-wrap gap-1"></div>
          </div>
          <pre id="status" class="whitespace-pre-wrap text-sm opacity-70 min-h-6 m-0">no file loaded</pre>
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-4">
        <section>
          <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">File information</h2>
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-3">
              <pre id="info" class="m-0 whitespace-pre font-mono text-xs leading-relaxed overflow-auto max-h-72">—</pre>
            </div>
          </div>
        </section>
        <section>
          <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">Order list</h2>
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-3">
              <div id="ordlist" class="font-mono text-xs leading-relaxed overflow-auto max-h-72 whitespace-pre">—</div>
            </div>
          </div>
        </section>
      </div>

      <section class="mb-4" id="messagesection" hidden>
        <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">Message</h2>
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body p-3">
            <pre id="message" class="m-0 whitespace-pre-wrap font-mono text-xs leading-relaxed overflow-auto max-h-72">—</pre>
          </div>
        </div>
      </section>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-4">
        <section>
          <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">Instruments</h2>
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-3">
              <div id="inslist" class="font-mono text-xs leading-relaxed overflow-auto max-h-72">—</div>
            </div>
          </div>
        </section>
        <section>
          <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">Samples</h2>
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-3">
              <div id="samplist" class="font-mono text-xs leading-relaxed overflow-auto max-h-72">—</div>
            </div>
          </div>
        </section>
      </div>

      <section>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-1">
          <h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-0">
            Pattern <span id="patnum" class="badge badge-primary badge-sm align-middle"></span>
          </h2>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs" aria-label="column legend">
            <span class="opacity-60">columns:</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-note">C-4</span> note</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-ins">01</span> instrument</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-vol">64</span> volume</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch cell-fx">F0A</span> effect</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch legend-empty">...</span> empty</span>
            <span class="inline-flex items-center gap-1"><span class="legend-swatch legend-rownum">  0</span> row</span>
          </div>
        </div>
        <div class="card bg-base-100 shadow-sm">
          <div id="pattern" class="card-body p-0">
            <div id="pathead"></div>
            <div id="patbody"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
