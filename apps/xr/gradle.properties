org.gradle.jvmargs=-Xmx1800m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

kotlin.incremental=false

# AGP 9 compatibility switches. AGP 9 tightened several build defaults and the
# project was moved onto it wholesale; these pin the behaviours the build was
# verified with instead of letting a minor AGP bump change them silently.
# Revisit each one deliberately, not by deleting the block.
android.defaults.buildfeatures.resvalues=true
# targetSdk comes from the manifest, not from compileSdk (immersive apps: 34).
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# Kotlin is applied through KGP; AGP must not also wire a built-in compiler.
android.builtInKotlin=false
# The build script uses the classic DSL the spatial plugin expects.
android.newDsl=false

# Suppress AGP 9 legacy compatibility warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.dependency.excludeLibraryComponentsFromConstraints=true
