<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Play Store feature graphic (1024x500). Placeholder: the app mark plus the
    wordmark. Regenerate with:
      rsvg-convert -w 1024 -h 500 store/feature.svg -o store/feature-1024x500.png
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1238" />
      <stop offset="0.5" stop-color="#0F0C1F" />
      <stop offset="1" stop-color="#0C0A18" />
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8EA2FF" stop-opacity="0.34" />
      <stop offset="1" stop-color="#8EA2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo2" cx="0.88" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#5FE3C0" stop-opacity="0.16" />
      <stop offset="1" stop-color="#5FE3C0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)" />
  <rect width="1024" height="500" fill="url(#halo)" />
  <rect width="1024" height="500" fill="url(#halo2)" />

  <!-- App mark on its tile: same path as the launcher icon, 108 -> 232 px -->
  <g transform="translate(148,134) scale(2.148)">
    <rect x="0" y="0" width="108" height="108" rx="26" fill="#130F22" />
    <path fill="#8ea2ff" d="M30,72V36h10l14,22 14,-22h10v36h-9V51l-15,23h-1L39,51v21z" />
  </g>

  <!-- Wordmark only: no tagline. Baseline 280 centres an 82 px line on y=250. -->
  <text x="444" y="280" font-family="Lato, DejaVu Sans, sans-serif" font-size="82" font-weight="bold" fill="#F1EDFB">
    modplay<tspan fill="#5FE3C0">js</tspan>
  </text>
</svg>
