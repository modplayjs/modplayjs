# AGP 9 + Kotlin 2.4 + KSP (Room) + the Compose compiler all load into this
# JVM: Kotlin runs in-process, so the Kotlin compiler's classes also live in
# the Gradle daemon metaspace. 1.5 GiB heap / 512 MiB metaspace is the old
# Android Studio default and runs out of metaspace on this project.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true
